[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fiesta-world-tier"
version = "0.2.0"
description = "Fail-closed cold-region storage primitives for Paper worlds"
requires-python = ">=3.10"
license = { file = "LICENSE" }
readme = "README.md"

[project.scripts]
fiesta-world-tier = "fiesta_world_tier.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
